project_id = "worshipcue-local-pilot"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:3000"
enable_signup = true
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
enable_confirmations = true
otp_length = 6
otp_expiry = 600

[storage]
enabled = true
file_size_limit = "100MiB"

[functions.finalize-asset]
verify_jwt = false

[functions.redeem-invitation]
verify_jwt = false

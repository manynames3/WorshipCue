name: CI

# Automated checks only. Physical Apple Pencil, real-iPad, multi-device and
# hosted-backend qualification stay manual and are recorded in verification/.

on:
  push:
    branches: [main, v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Contracts, docs and Swift packages (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install SQLite and Python tooling
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends python3 python3-venv sqlite3 libsqlite3-dev

      - name: Documentation links
        run: python3 -I scripts/check_docs.py

      - name: Contract, fixture and local-schema verifier
        run: |
          python3 -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet -r scripts/requirements.txt
          /tmp/verify/bin/python -I scripts/verify_package.py

      - name: Core domain rules (WorshipCueCore)
        run: swift test --package-path reference/WorshipCueCore

      - name: Local library and ink storage (WorshipCueLocal)
        run: swift test --package-path packages/WorshipCueLocal

      - name: Ink storage and geometry checks (InkChecks)
        run: swift run --package-path packages/WorshipCueLocal InkChecks

  ipad:
    name: iPad app build and simulator tests (Xcode)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Toolchain
        run: xcodebuild -version && swift --version

      - name: Xcode project structure
        run: python3 -I scripts/verify_m0_project.py

      - name: PencilKit and PDFKit framework checks (macOS)
        run: sh scripts/check_macos_frameworks.sh

      # Ad-hoc simulator signing ("Sign to Run Locally") embeds the entitlements the
      # Keychain needs; an unsigned build makes every credential write fail.
      - name: Build app and tests
        run: |
          set -o pipefail
          xcodebuild -project apps/ipad/WorshipCue.xcodeproj -scheme WorshipCue \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= build-for-testing 2>&1 | tee "$RUNNER_TEMP/build.log" \
            || { python3 -I scripts/ci_annotate.py "$RUNNER_TEMP/build.log"; exit 1; }

      - name: Native tests on an iPad simulator
        run: |
          set -o pipefail
          read -r udid simulator < <(xcrun simctl list --json devices available | python3 -I -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if ".iOS-" in runtime:
                  for device in devices[runtime]:
                      if device["name"].startswith("iPad") and device.get("isAvailable"):
                          name, version = device["name"], runtime.rsplit(".iOS-", 1)[1].replace("-", ".")
                          print(device["udid"], f"{name} / iOS {version}"); sys.exit(0)
          sys.exit("no available iPad simulator on this runner")')
          [ -n "${udid:-}" ] || exit 1
          echo "Using $simulator ($udid)"
          xcodebuild -project apps/ipad/WorshipCue.xcodeproj -scheme WorshipCue \
            -destination "platform=iOS Simulator,id=$udid" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/NativeTests.xcresult" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= test-without-building 2>&1 | tee "$RUNNER_TEMP/test.log" \
            || { python3 -I scripts/ci_annotate.py "$RUNNER_TEMP/test.log"; exit 1; }
          summary=$(grep -E 'Executed [0-9]+ tests?' "$RUNNER_TEMP/test.log" | tail -1 | sed 's/^[[:space:]]*//')
          echo "::notice title=Native tests::$(xcodebuild -version | head -1), $simulator: $summary"

      - name: Keep build and test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ipad-logs
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/test.log
            ${{ runner.temp }}/NativeTests.xcresult
          if-no-files-found: ignore
          retention-days: 14
